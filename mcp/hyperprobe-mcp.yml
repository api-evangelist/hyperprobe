description: Official Hyperprobe MCP server, published to npm as @hyperprobe/mcp-server and run locally
  over stdio. It lets AI coding agents autonomously debug and trace running production code by dynamically
  registering conditional probes inside a live application and reading the captured variable/telemetry
  evidence back into the agent's context. Configured per-workspace by pointing the agent at the npx command
  with a BACKEND_URL environment variable.
