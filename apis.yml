aid: hyperprobe
name: Hyperprobe
description: >-
  Hyperprobe is a runtime data platform for AI-native software development,
  built by a San Francisco team in Y Combinator's Summer 2026 batch. It lets
  developers and coding agents (Cursor, Claude Code, Codex, opencode, Windsurf)
  set live, non-breaking breakpoints in running production services directly
  from the IDE — capturing exact variable snapshots, injecting logs, and tracing
  call stacks without pausing threads, redeploying, or changing source code.
  Probes are read-only and non-blocking with under 1% overhead, and PII is
  redacted in-process before any data leaves the container's memory boundary
  (password, secret, token, authorization, cookie, key, signature, ssn and
  creditCard patterns are masked by default). Hyperprobe ships in-process SDKs
  for Node.js (@hyperprobe/node-sdk), Java (a bytecode-instrumentation agent),
  and Python (hyperprobe-agent), a VS Code extension, and an official Model
  Context Protocol (MCP) server (@hyperprobe/mcp-server) that lets AI assistants
  autonomously register conditional probes and read real runtime evidence
  instead of flat logs. The platform can run fully self-hosted via Docker
  Compose. Originally added to the API Evangelist network as a Y Combinator
  portfolio lead, this profile has been enriched from Hyperprobe's public
  developer surface.
